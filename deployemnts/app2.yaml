apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app2
  namespace: app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app2
  template:
    metadata:
      labels:
        app: nginx-app2
    spec:
      containers:
        - name: nginx
          image: docker.io/aboelnour007/nginx-app2:1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-app2-service
  namespace: app2
spec:
  type: ClusterIP
  selector:
    app: nginx-app2
  ports:
    - port: 80
      targetPort: 80