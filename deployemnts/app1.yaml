apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app1
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app1
  template:
    metadata:
      labels:
        app: nginx-app1
    spec:
      containers:
        - name: nginx
          image: docker.io/aboelnour007/nginx-app1:2.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-app1-service
  namespace: app1
spec:
  type: ClusterIP
  selector:
    app: nginx-app1
  ports:
    - port: 80
      targetPort: 80